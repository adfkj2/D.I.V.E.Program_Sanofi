[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "we-once-talked"
version = "0.1.0"
description = "Local-first evidence, three selves, and explicitly simulated conversations"
license-files = ["vendor/nuwa-personas/*/LICENSE"]
requires-python = ">=3.11"
dependencies = ["dive-memory==0.4.0+wot.core", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.28,<1", "keyring>=25,<26", "Pillow>=11,<13"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.28", "ruff>=0.8"]

[project.scripts]
wot = "wot.main:main"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.setuptools.package-data]
wot = ["data/*.json"]

[tool.pytest.ini_options]
pythonpath = ["backend", "vendor/dive-memory/src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
