name: WeOnceTalked quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.14']
    env:
      WOT_PROVIDER: mock
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - name: Install pinned dependencies and local memory core
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock.txt build
          python -m pip install --no-deps -e vendor/dive-memory
          python -m pip install --no-deps -e .
      - name: Lint owned Python sources
        run: python -m ruff check backend tests scripts frontend/tests/e2e_server.py
      - name: Backend, provider contracts and privacy regressions
        run: python -m pytest -q
      - name: Build distributable wheel
        run: |
          python -m build --wheel
          python -m pip install --force-reinstall --no-deps dist/*.whl
      - name: Verify installed package outside the checkout
        working-directory: /tmp
        run: |
          python -c "from wot.catalog import builtin_people; from wot.connections import ConnectionManager; from wot.assessments import AssessmentManager; assert len(builtin_people()) == 15"
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-python-${{ matrix.python }}
          path: dist/*.whl
          if-no-files-found: error

  browser:
    name: Responsive browser flows
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WOT_PROVIDER: mock
      PYTHONUTF8: '1'
      PYTHONPATH: backend:vendor/dive-memory/src
      WOT_E2E_ALLOW_WRITE: '1'
      WOT_E2E_URL: http://127.0.0.1:8765
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install local backend and frontend
        run: |
          python -m pip install -r requirements.lock.txt
          python -m pip install --no-deps -e vendor/dive-memory
          python -m pip install --no-deps -e .
          npm ci --prefix frontend
      - name: Build frontend and install isolated browser
        working-directory: frontend
        run: |
          npm run build
          npx playwright install --with-deps chromium
      - name: Exercise upgrade flows with an isolated mock service
        run: |
          mkdir -p artifacts
          export WOT_DATA_DIR="$PWD/artifacts/ci-e2e"
          python frontend/tests/e2e_server.py > artifacts/ci-e2e-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true' EXIT
          python - <<'PY'
          import time
          import urllib.request
          for attempt in range(100):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:8765/api/v1/healthz', timeout=1) as response:
                      assert response.status == 200
                  break
              except (OSError, AssertionError):
                  time.sleep(.2)
          else:
              raise SystemExit('Isolated browser-test server did not start')
          PY
          node frontend/tests/upgrade-e2e.mjs
      - name: Upload screenshots and browser report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-browser-report
          path: |
            frontend/artifacts/upgrade-e2e/
            artifacts/ci-e2e-server.log
          if-no-files-found: warn
