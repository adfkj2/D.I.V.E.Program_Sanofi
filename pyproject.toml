[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dive-memory"
version = "0.4.0"
description = "Event-sourced long-term interactive AI memory service"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=8", "httpx>=0.28"]
models = ["sentence-transformers>=3.0"]
postgres = ["psycopg[binary]>=3.2", "pgvector>=0.4"]

[project.scripts]
dive-memory = "dive_memory.cli:main"
dive-memory-oracle = "dive_memory.application.oracle_run:main"
dive-memory-benchmark = "dive_memory.benchmark:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dive_memory = ["static/*.html", "static/*.css", "static/*.js", "static/*.json", "static/*.svg", "data/*.json"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "BLE001", "RUF012"]

[tool.mypy]
files = ["src/dive_memory/agent", "src/dive_memory/application", "src/dive_memory/web.py", "src/dive_memory/cli.py", "src/dive_memory/observability.py"]
follow_imports = "skip"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true

[tool.coverage.run]
branch = true
source = ["dive_memory"]
relative_files = true

[tool.coverage.report]
show_missing = true
precision = 2

[tool.dive-quality]
lint-targets = [
  "src/dive_memory/agent", "src/dive_memory/application", "src/dive_memory/web.py", "src/dive_memory/cli.py",
  "src/dive_memory/observability.py", "tools/windows/launcher.py",
  "tools/build_project_casebook.py", "tools/check_quality.py",
  "tests/test_application_delivery.py", "tests/test_delivery_cold_run.py",
  "tests/test_project_briefing.py", "tests/test_project_resumption_cli.py",
  "tests/test_windows_launcher.py", "tests/test_metrics.py",
  "tests/test_quality_gate.py", "tests/test_application_boundaries.py",
  "tests/test_architecture_boundaries.py", "tests/test_product_loop.py", "tests/test_project_agent.py", "tests/test_agent_transport.py",
]

[tool.dive-quality.coverage.delivery]
include = ["src/dive_memory/agent/*.py", "src/dive_memory/application/*.py", "src/dive_memory/web.py", "src/dive_memory/cli.py", "src/dive_memory/observability.py"]
line-min = 90
branch-min = 80

[tool.dive-quality.coverage.memory-core]
include = ["src/dive_memory/service.py", "src/dive_memory/store.py", "src/dive_memory/temporal.py"]
line-min = 90
branch-min = 80
