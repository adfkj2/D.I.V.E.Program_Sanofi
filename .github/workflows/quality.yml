name: Engineering checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  local-runtime:
    strategy:
      matrix:
        python: ['3.12', '3.14']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements/dev.lock
      - run: python -m pip install --no-deps -e .
      - run: python tools/check_quality.py --output artifacts/quality
      - run: python eval/run_project_validation.py --output artifacts/structured
      - run: python -m build --wheel
      - run: python tools/verify_wheel.py --wheel-dir dist --output artifacts/wheel
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: engineering-${{ matrix.python }}
          path: |
            artifacts/quality/*.json
            artifacts/quality/*.xml
            artifacts/quality/*.txt
            artifacts/structured/
            artifacts/wheel/summary.json
            artifacts/wheel/install-log.json
            artifacts/wheel/smoke-output.txt
  postgres-contract:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: dive
          POSTGRES_PASSWORD: local_ci_fixture
          POSTGRES_DB: dive_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U dive -d dive_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DIVE_TEST_POSTGRES_DSN: postgresql://dive:local_ci_fixture@localhost:5432/dive_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements/postgres.lock
      - run: python -m pytest tests/integration/postgres -q --junitxml=postgres-tests.xml
      - name: Require PostgreSQL contracts to run without skips
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          suites = list(ET.parse('postgres-tests.xml').getroot().iter('testsuite'))
          assert sum(int(s.get('tests', 0)) for s in suites) > 0, 'No PostgreSQL tests ran'
          for field in ('skipped', 'failures', 'errors'):
              assert sum(int(s.get(field, 0)) for s in suites) == 0, f'PostgreSQL {field} must be zero'
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: postgres-contract
          path: postgres-tests.xml
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f ops/docker/Dockerfile -t dive-memory:ci .
      - name: Run the image and probe the real readiness endpoint
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name dive-ci -p 127.0.0.1:8765:8765 dive-memory:ci
          trap 'docker rm -f dive-ci >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8765/api/readiness; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8765/api/readiness
          curl --fail --silent http://127.0.0.1:8765/metrics | grep -E 'dive_http_requests_total|dive_readiness'
          docker inspect --format '{{.State.Health.Status}}' dive-ci
  workbench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python -m pip install -r requirements/runtime.lock && python -m pip install --no-deps .
      - run: npm ci && npx playwright install --with-deps chromium
      - run: npm run format:check
      - name: Exercise the real workbench
        shell: bash
        run: |
          mkdir -p artifacts
          python -m dive_memory.cli --db artifacts/ui.db serve --port 8765 > artifacts/server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8765/healthz; then break; fi
            sleep 1
          done
          node tools/verify_workbench.cjs artifacts/workbench
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workbench
          path: |
            artifacts/workbench/
            artifacts/server.log
