name: Engineering checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  local-runtime:
    strategy:
      matrix:
        python: ['3.12', '3.14']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements/dev.lock
      - run: python -m pip install --no-deps -e .
      - run: python -m pytest -q --junitxml=artifacts/tests.xml
      - run: python -m ruff check src/dive_memory/application src/dive_memory/web.py src/dive_memory/cli.py tests/test_application_delivery.py tests/test_delivery_cold_run.py
      - run: python -m ruff format --check src/dive_memory/application src/dive_memory/web.py src/dive_memory/cli.py tests/test_application_delivery.py tests/test_delivery_cold_run.py
      - run: python -m mypy src/dive_memory/application src/dive_memory/web.py src/dive_memory/cli.py --follow-imports skip --ignore-missing-imports
      - run: python eval/run_project_validation.py --output artifacts/structured
      - run: python -m build --wheel
      - run: python tools/verify_wheel.py --wheel-dir dist --output artifacts/wheel
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: engineering-${{ matrix.python }}
          path: |
            artifacts/tests.xml
            artifacts/structured/
            artifacts/wheel/summary.json
            artifacts/wheel/install-log.json
            artifacts/wheel/smoke-output.txt
  postgres-contract:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: dive
          POSTGRES_PASSWORD: local_ci_fixture
          POSTGRES_DB: dive_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U dive -d dive_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DIVE_TEST_POSTGRES_DSN: postgresql://dive:local_ci_fixture@localhost:5432/dive_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements/postgres.lock
      - run: python -m pytest tests/integration/postgres -q --junitxml=postgres-tests.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: postgres-contract
          path: postgres-tests.xml
  workbench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python -m pip install -r requirements/runtime.lock && python -m pip install --no-deps .
      - run: npm ci && npx playwright install --with-deps chromium
      - run: npm run format:check
      - name: Exercise the real workbench
        shell: bash
        run: |
          mkdir -p artifacts
          python -m dive_memory.cli --db artifacts/ui.db serve --port 8765 > artifacts/server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8765/healthz; then break; fi
            sleep 1
          done
          node tools/verify_workbench.cjs artifacts/workbench
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workbench
          path: |
            artifacts/workbench/
            artifacts/server.log
